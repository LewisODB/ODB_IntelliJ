name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILD_JAVA_VERSION: '21'
  TARGET_JAVA_VERSION: 8.0.492+9

jobs:
  package-unsigned:
    name: Package unsigned ZIP once
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ steps.archive.outputs.artifact-name }}
      plugin-sha256: ${{ steps.archive.outputs.plugin-sha256 }}
    steps:
      - name: Fetch sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install target JDK 8
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: ${{ env.TARGET_JAVA_VERSION }}

      - name: Install build JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.BUILD_JAVA_VERSION }}

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Test and package once
        run: >-
          ./gradlew --no-daemon clean test buildPlugin verifyBundledOdb
          verifyProbeIsolation verifyPluginProjectConfiguration verifyPluginStructure

      - name: Address unsigned ZIP by SHA-256
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find build/distributions -maxdepth 1 -type f -name '*.zip' -print)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          plugin_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          echo "artifact-name=lewis-odb-unsigned-$plugin_sha256" >> "$GITHUB_OUTPUT"
          echo "plugin-sha256=$plugin_sha256" >> "$GITHUB_OUTPUT"
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload exact unsigned ZIP
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.archive.outputs.artifact-name }}
          path: ${{ steps.archive.outputs.path }}
          archive: false
          if-no-files-found: error
          overwrite: false

  headless-feature-tests:
    name: IDEA 252 Community feature tests
    needs: package-unsigned
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install target JDK 8
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: ${{ env.TARGET_JAVA_VERSION }}

      - name: Install build JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.BUILD_JAVA_VERSION }}

      - name: Configure Gradle read-only cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Run exact IDEA feature suite
        run: ./gradlew --no-daemon testIde252Community

      - name: Retain failed test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-testIde252Community-${{ github.run_id }}
          path: build/reports/tests/testIde252Community
          if-no-files-found: warn

  exact-zip-verifier:
    name: Verify downloaded ZIP on IDEA 252 Community
    needs: package-unsigned
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install build JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.BUILD_JAVA_VERSION }}

      - name: Configure Gradle read-only cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Download exact unsigned ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package-unsigned.outputs.artifact-id }}
          path: candidate
          skip-decompress: true
          digest-mismatch: error

      - name: Verify ZIP checksum and no-rebuild wiring
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find candidate -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "${{ needs.package-unsigned.outputs.plugin-sha256 }}"
          bash scripts/assert-no-plugin-rebuild.sh verifyExactPlugin "$archive"
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Inspect and run Plugin Verifier on exact ZIP
        run: >-
          ./gradlew --no-daemon verifyExactPlugin
          "-PpluginArchive=${{ steps.candidate.outputs.path }}"

      - name: Retain exact-ZIP reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-zip-reports-252-community-${{ github.run_id }}
          path: |
            build/reports/bundledOdb
            build/reports/pluginVerifier
          if-no-files-found: warn

  installed-zip-smoke:
    name: IDEA 252 Community installed-ZIP open/close
    needs: package-unsigned
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install build JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.BUILD_JAVA_VERSION }}

      - name: Configure Gradle read-only cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Download exact unsigned ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package-unsigned.outputs.artifact-id }}
          path: candidate
          skip-decompress: true
          digest-mismatch: error

      - name: Verify ZIP checksum and no-rebuild wiring
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find candidate -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "${{ needs.package-unsigned.outputs.plugin-sha256 }}"
          bash scripts/assert-no-plugin-rebuild.sh verifyInstalledZipSmoke "$archive"
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Open and close exact ZIP without ODB Swing
        run: >-
          xvfb-run -a ./gradlew --no-daemon verifyInstalledZipSmoke
          "-PpluginArchive=${{ steps.candidate.outputs.path }}"

      - name: Retain installed-ZIP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-zip-smoke-${{ github.run_id }}
          path: build/reports/installedZipSmoke
          if-no-files-found: warn
