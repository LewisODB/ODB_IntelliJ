name: Sign release candidate

on:
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: Trusted CI workflow run ID
        required: true
        type: string
      unsigned-artifact-id:
        description: Immutable unsigned artifact ID
        required: true
        type: string
      unsigned-sha256:
        description: Expected unsigned plugin ZIP SHA-256
        required: true
        type: string
      tested-commit:
        description: Commit that produced the unsigned ZIP
        required: true
        type: string
      release-version:
        description: Release version without v prefix
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  BUILD_JAVA_VERSION: '21'

jobs:
  sign-once:
    name: Sign exact unsigned ZIP once
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    outputs:
      signed-artifact-id: ${{ steps.upload-signed.outputs.artifact-id }}
      signed-artifact-name: ${{ steps.signed.outputs.artifact-name }}
      signed-sha256: ${{ steps.signed.outputs.sha256 }}
      signing-evidence-artifact-id: ${{ steps.upload-signing-evidence.outputs.artifact-id }}
    steps:
      - name: Validate source workflow, commit, and annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.tested-commit }}
          RELEASE_VERSION: ${{ inputs.release-version }}
          SOURCE_RUN_ID: ${{ inputs.ci-run-id }}
        run: |
          set -euo pipefail
          IFS=$'\t' read -r run_commit run_conclusion run_path run_repository run_event run_branch < <(
            gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN_ID" \
              --jq '[.head_sha, .conclusion, .path, .head_repository.full_name, .event, .head_branch] | @tsv'
          )
          test "$run_commit" = "$EXPECTED_COMMIT"
          test "$run_conclusion" = "success"
          test "$run_path" = ".github/workflows/ci.yml"
          test "$run_repository" = "${{ github.repository }}"
          [[ "$run_event" == "push" || "$run_event" == "workflow_dispatch" ]]
          test "$run_branch" = "main"

          IFS=$'\t' read -r tag_type tag_object < <(
            gh api "repos/${{ github.repository }}/git/ref/tags/v$RELEASE_VERSION" \
              --jq '[.object.type, .object.sha] | @tsv'
          )
          test "$tag_type" = "tag"
          tag_commit="$(
            gh api "repos/${{ github.repository }}/git/tags/$tag_object" --jq '.object.sha'
          )"
          test "$tag_commit" = "$EXPECTED_COMMIT"

      - name: Fetch tested sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tested-commit }}

      - name: Install build JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.BUILD_JAVA_VERSION }}

      - name: Configure Gradle read-only cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Download exact unsigned ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci-run-id }}
          artifact-ids: ${{ inputs.unsigned-artifact-id }}
          path: candidate
          skip-decompress: true
          digest-mismatch: error

      - name: Validate version, checksum, and no-rebuild wiring
        id: unsigned
        shell: bash
        env:
          EXPECTED_SHA256: ${{ inputs.unsigned-sha256 }}
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          set -euo pipefail
          archive="$(find candidate -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(sed -n 's/^pluginVersion = //p' gradle.properties)" = "$RELEASE_VERSION"
          grep -Fq "## [$RELEASE_VERSION]" CHANGELOG.md
          bash scripts/assert-no-plugin-rebuild.sh signPlugin "$archive"
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Sign once and verify signature
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build/reports build/signing
          printf '%s\n' "$CERTIFICATE_CHAIN" > build/signing/chain.crt
          unset CERTIFICATE_CHAIN
          ./gradlew --no-daemon signPlugin verifyPluginSignature \
            "-PpluginArchive=${{ steps.unsigned.outputs.path }}" \
            "-PsignatureCertificateChainFile=build/signing/chain.crt" \
            2>&1 | tee build/reports/signature-verification.txt

      - name: Identify signed ZIP
        id: signed
        shell: bash
        env:
          UNSIGNED_ARCHIVE: ${{ steps.unsigned.outputs.path }}
        run: |
          set -euo pipefail
          archive="${UNSIGNED_ARCHIVE%.zip}-signed.zip"
          test -f "$archive"
          sha256="$(sha256sum "$archive" | awk '{print $1}')"
          echo "artifact-name=lewis-odb-signed-$sha256" >> "$GITHUB_OUTPUT"
          echo "path=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Reinspect signed ZIP without rebuilding
        run: |
          set -euo pipefail
          bash scripts/assert-no-plugin-rebuild.sh verifyBundledOdb "${{ steps.signed.outputs.path }}"
          bash scripts/assert-no-plugin-rebuild.sh verifyProbeIsolation "${{ steps.signed.outputs.path }}"
          ./gradlew --no-daemon verifyBundledOdb verifyProbeIsolation \
            "-PpluginArchive=${{ steps.signed.outputs.path }}"

      - name: Assemble signing evidence
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
        run: |
          set -euo pipefail
          mkdir -p build/release-evidence
          printf '%s\n' "$CERTIFICATE_CHAIN" > build/release-evidence/certificate-chain.pem
          openssl x509 -in build/release-evidence/certificate-chain.pem \
            -noout -fingerprint -sha256 -subject -issuer -dates \
            > build/release-evidence/certificate-details.txt
          sha256sum "${{ steps.unsigned.outputs.path }}" "${{ steps.signed.outputs.path }}" \
            > build/release-evidence/plugin-SHA256SUMS
          unzip -l "${{ steps.signed.outputs.path }}" \
            > build/release-evidence/signed-plugin-inventory.txt
          cp -R build/reports/bundledOdb build/release-evidence/bundled-odb
          cp build/reports/signature-verification.txt \
            build/release-evidence/signature-verification.txt
          cp src/main/resources/legal/odb-runtime.cdx.json \
            build/release-evidence/odb-runtime.cdx.json
          cp src/main/resources/legal/odb-runtime-osv.json \
            build/release-evidence/odb-runtime-osv.json
          cp release-inputs/odb/SHA256SUMS \
            build/release-evidence/odb-release-SHA256SUMS

      - name: Upload exact signed ZIP
        id: upload-signed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.signed.outputs.artifact-name }}
          path: ${{ steps.signed.outputs.path }}
          archive: false
          if-no-files-found: error
          overwrite: false

      - name: Record signed artifact identity
        run: |
          set -euo pipefail
          printf '%s\n' \
            "workflow_run=${{ github.run_id }}" \
            "tested_commit=${{ inputs.tested-commit }}" \
            "release_version=${{ inputs.release-version }}" \
            "source_ci_run=${{ inputs.ci-run-id }}" \
            "unsigned_artifact_id=${{ inputs.unsigned-artifact-id }}" \
            "unsigned_sha256=${{ inputs.unsigned-sha256 }}" \
            "signed_artifact_id=${{ steps.upload-signed.outputs.artifact-id }}" \
            "signed_artifact_digest=${{ steps.upload-signed.outputs.artifact-digest }}" \
            "signed_sha256=${{ steps.signed.outputs.sha256 }}" \
            > build/release-evidence/artifact-provenance.txt

      - name: Upload signing evidence
        id: upload-signing-evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-evidence-${{ steps.signed.outputs.sha256 }}
          path: build/release-evidence
          if-no-files-found: error
          overwrite: false

  exact-signed-verifier:
    name: Verify signed ZIP on IDEA 252 Community
    needs: sign-once
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch tested sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tested-commit }}

      - name: Install build JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.BUILD_JAVA_VERSION }}

      - name: Configure Gradle read-only cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Download exact signed ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign-once.outputs.signed-artifact-id }}
          path: candidate
          skip-decompress: true
          digest-mismatch: error

      - name: Verify checksum and no-rebuild wiring
        id: candidate
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.sign-once.outputs.signed-sha256 }}
        run: |
          set -euo pipefail
          archive="$(find candidate -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_SHA256"
          bash scripts/assert-no-plugin-rebuild.sh verifyExactPlugin "$archive"
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Inspect and run Plugin Verifier on signed ZIP
        run: >-
          ./gradlew --no-daemon verifyExactPlugin
          "-PpluginArchive=${{ steps.candidate.outputs.path }}"

      - name: Upload signed-ZIP verifier evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-verifier-252-community-${{ needs.sign-once.outputs.signed-sha256 }}
          path: |
            build/reports/bundledOdb
            build/reports/pluginVerifier
          if-no-files-found: warn
          overwrite: false

  source-rebuild:
    name: Rebuild ODB from corresponding source
    needs: sign-once
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      evidence-artifact-id: ${{ steps.upload-source-evidence.outputs.artifact-id }}
    steps:
      - name: Fetch tested sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tested-commit }}

      - name: Rebuild canonical ODB release from source archive
        env:
          SOURCE_DIRECTORY: ${{ runner.temp }}/odb-source
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIRECTORY" build/reports/source-rebuild
          tar -xzf release-inputs/odb/odb-source-*.tar.gz -C "$SOURCE_DIRECTORY"
          "$SOURCE_DIRECTORY/scripts/verify-canonical-release.sh" \
            2>&1 | tee build/reports/source-rebuild/build.txt
          (
            cd "$SOURCE_DIRECTORY/build/canonical-release"
            sha256sum -c "$GITHUB_WORKSPACE/release-inputs/odb/SHA256SUMS"
          ) | tee build/reports/source-rebuild/checksums.txt
          cmp release-inputs/odb/SHA256SUMS \
            "$SOURCE_DIRECTORY/build/canonical-release/SHA256SUMS"
          cp "$SOURCE_DIRECTORY/build/canonical-release/SHA256SUMS" \
            build/reports/source-rebuild/regenerated-SHA256SUMS
          cp "$SOURCE_DIRECTORY/build/canonical-release/odb-release.json" \
            build/reports/source-rebuild/odb-release.json

      - name: Upload source-rebuild evidence
        id: upload-source-evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-rebuild-${{ needs.sign-once.outputs.signed-sha256 }}
          path: build/reports/source-rebuild
          if-no-files-found: error
          overwrite: false

  aggregate-evidence:
    name: Aggregate release-candidate evidence
    needs: [sign-once, exact-signed-verifier, source-rebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download signing evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign-once.outputs.signing-evidence-artifact-id }}
          path: evidence/signing
          digest-mismatch: error

      - name: Download Plugin Verifier evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: signed-verifier-*-${{ needs.sign-once.outputs.signed-sha256 }}
          path: evidence/plugin-verifier
          digest-mismatch: error

      - name: Download source-rebuild evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.source-rebuild.outputs.evidence-artifact-id }}
          path: evidence/source-rebuild
          digest-mismatch: error

      - name: Upload complete release-candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-evidence-${{ needs.sign-once.outputs.signed-sha256 }}
          path: evidence
          if-no-files-found: error
          overwrite: false
